<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Convert — settings</title>
<style>
  :root{
    --bg:#14181c; --panel:#1b2126; --panel-2:#1f262c; --line:#2b333a;
    --bone:#e9e6df; --bone-dim:#9aa2a9; --brass:#c9a227; --brass-dim:#8a7326;
  }
  body{
    margin:0; padding:28px;
    background:var(--bg); color:var(--bone);
    font-family:'Segoe UI', Inter, sans-serif;
    width:340px;
  }
  h1{ font-size:16px; margin:0 0 4px; }
  p{ font-size:12.5px; color:var(--bone-dim); margin:0 0 18px; line-height:1.5; }
  label{ font-size:12px; color:var(--bone-dim); display:block; margin-bottom:6px; }
  input{
    width:100%; box-sizing:border-box;
    background:var(--panel-2); border:1px solid var(--line); color:var(--bone);
    border-radius:6px; padding:10px 12px; font-family:'JetBrains Mono', monospace;
    font-size:13px; outline:none;
  }
  input:focus{ border-color:var(--brass-dim); }
  button{
    margin-top:14px; width:100%;
    background:var(--brass); color:#1a1500; border:none; border-radius:6px;
    padding:10px; font-weight:600; font-size:13px; cursor:pointer;
  }
  button:hover{ filter:brightness(1.08); }
  #status{ margin-top:10px; font-size:12px; color:var(--brass); min-height:16px; }
</style>
</head>
<body>
  <h1>Convert — settings</h1>
  <p>Address of your local Convert server. Only change this if you started it on a different port.</p>
  <label for="url">Server URL</label>
  <input id="url" type="text" placeholder="http://localhost:3000" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
